services:
  metadata-db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cdc_monitoring
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Aşağıdaki iki servis, izlenecek "gerçek" PostgreSQL örneklerini simüle eder
  # (prod'da bunlar K8s dışındaki sunucular olurdu). wal_level=logical burada
  # yalnızca local test kolaylığı için doğrudan container komutuyla açılıyor;
  # gerçek ortamda bu DB ekibinin sorumluluğundadır (bkz. BRD §9 varsayımları).
  # max_replication_slots/max_wal_senders/max_logical_replication_workers varsayılanları
  # (sırasıyla 10/10/4) cdc-fixture'ın kurduğu ~25 subscription/slot için yetersiz
  # kaldığından yükseltildi; max_worker_processes de buna göre artırıldı.
  pub-db:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=30", "-c", "max_wal_senders=30", "-c", "max_logical_replication_workers=30", "-c", "max_worker_processes=40"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  sub-db:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=30", "-c", "max_wal_senders=30", "-c", "max_logical_replication_workers=30", "-c", "max_worker_processes=40"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_replica
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  # dom-lending-api (Senaryo 2) hem hedef (catalog'a abone) hem kaynak (kendi publication'ını
  # aşağı akışa yayınlar) bir "relay" düğümdür. Bunu pub-db veya sub-db üzerinde barındırmak
  # kendi kendine döngü yapan (aynı sunucuya geri bağlanan) bir CREATE SUBSCRIPTION'a yol açar:
  # komut, kendi açtığı walsender'ın bitmesini beklerken walsender da komutun tuttuğu
  # transactionid kilidini bekler — süresiz deadlock. Bu yüzden dom-lending-api'ye özel,
  # ayrı bir üçüncü Postgres örneği (mid-db) gerekiyor: hem catalog'dan (pub-db) hem
  # mid-db'nin kendisinden aboneler (sub-db) FARKLI sunuculara bağlanır, deadlock oluşmaz.
  mid-db:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=30", "-c", "max_wal_senders=30", "-c", "max_logical_replication_workers=30", "-c", "max_worker_processes=40"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lending
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  # pub-db/sub-db sağlıklı olur olmaz, aralarında gerçek bir logical replication
  # publication/subscription kurar (scripts/setup-local-cdc-test.sh ile aynı işi yapar,
  # ama `docker compose up` ile birlikte otomatik çalışır — ayrıca bash script çalıştırmaya
  # gerek kalmaz). Idempotent: publication/subscription zaten varsa hatasız geçer.
  cdc-fixture:
    image: postgres:16
    depends_on:
      pub-db:
        condition: service_healthy
      sub-db:
        condition: service_healthy
      mid-db:
        condition: service_healthy
    volumes:
      - ./scripts/cdc-fixture-entrypoint.sh:/cdc-fixture-entrypoint.sh:ro
    entrypoint: ["sh", "/cdc-fixture-entrypoint.sh"]
    restart: "no"

  # Gerçek bir SMTP sunucusu olmadan e-posta bildirimlerini (FR-10) doğrulamak
  # için: Mailpit gönderilen tüm e-postaları yakalar, http://localhost:8025
  # üzerinde bir web arayüzünde gösterir. Prod'da yerini kurumsal SMTP alır.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      metadata-db:
        condition: service_healthy
      pub-db:
        condition: service_healthy
      sub-db:
        condition: service_healthy
      mid-db:
        condition: service_healthy
    environment:
      # Yalnızca bootstrap ayarları burada kalır (DB'ye bağlanmadan önce gerekiyorlar).
      # Health check/discovery/alerting/reconciliation/email ayarları artık DB'de
      # (SystemSettings tablosu) saklanıyor ve /settings ekranından yönetiliyor —
      # local testte oradan mailpit:1025'i, kısa interval'leri vb. gir.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MetadataDb: "Host=metadata-db;Port=5432;Database=cdc_monitoring;Username=postgres;Password=postgres"
      # cdc-fixture'ın pub-db/sub-db üzerinde kurduğu publication/subscription'a karşılık gelen
      # iki bağlantıyı Connections ekranına otomatik kaydeder (bkz. Program.cs) — elle
      # "Yeni Bağlantı" formu doldurmaya gerek kalmaz.
      Seed__LocalCdcFixtureConnections: "true"
    ports:
      - "5299:8080"
