apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cdc-monitoring
  labels:
    app: cdc-monitoring
spec:
  type: {{ .Values.service.type }}
  selector:
    app: cdc-monitoring
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      name: http
